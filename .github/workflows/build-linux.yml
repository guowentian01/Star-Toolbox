name: Build Linux app (银河麒麟 X86_64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Linux x64 (deb + AppImage)
        run: npm run dist:linux

      - name: List artifacts
        run: ls -la release/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: StarToolbox-Linux-x64
          path: |
            release/*.deb
            release/*.AppImage
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.deb
            release/*.AppImage
