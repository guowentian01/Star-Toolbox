name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate .icns from PNG master (system tools)
        run: |
          set -e
          mkdir -p build/star.iconset
          sips -z 16 16     build/icon.png --out build/star.iconset/icon_16x16.png      >/dev/null
          sips -z 32 32     build/icon.png --out build/star.iconset/icon_16x16@2x.png   >/dev/null
          sips -z 32 32     build/icon.png --out build/star.iconset/icon_32x32.png      >/dev/null
          sips -z 64 64     build/icon.png --out build/star.iconset/icon_32x32@2x.png   >/dev/null
          sips -z 128 128   build/icon.png --out build/star.iconset/icon_128x128.png    >/dev/null
          sips -z 256 256   build/icon.png --out build/star.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   build/icon.png --out build/star.iconset/icon_256x256.png    >/dev/null
          sips -z 512 512   build/icon.png --out build/star.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   build/icon.png --out build/star.iconset/icon_512x512.png    >/dev/null
          sips -z 1024 1024 build/icon.png --out build/star.iconset/icon_512x512@2x.png >/dev/null
          iconutil -c icns build/star.iconset -o build/icon.icns
          ls -la build/icon.icns

      - name: Install dependencies
        run: npm install

      - name: Build macOS arm64 dmg
        run: npm run dist:mac

      - name: List artifacts
        run: ls -la release/

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: StarToolbox-macOS
          path: |
            release/*.dmg
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
